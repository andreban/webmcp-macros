<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flight search fixture</title>
  </head>
  <body>
    <!--
      Mimics the GoogleChromeLabs react-flightsearch demo's WebMCP tools: same
      names, schemas and messages. The search view registers only
      searchFlights; a search moves to the results view with a client-side
      route change (#/results?…, as its HashRouter does), and the results view
      registers listFlights, setFilters and resetFilters a moment later, once
      it has "mounted".
    -->
    <p>View: <output id="view"></output></p>
    <p>Search: <output id="search"></output></p>
    <p>Filters: <output id="filters"></output></p>
    <p>Flights shown: <output id="shown"></output></p>
    <script>
      const FLIGHTS = [
        { id: 1, airline: "AA", stops: 0, price: 420 },
        { id: 2, airline: "BA", stops: 0, price: 780 },
        { id: 3, airline: "UA", stops: 1, price: 350 },
        { id: 4, airline: "DL", stops: 1, price: 610 },
        { id: 5, airline: "LH", stops: 2, price: 290 },
      ];
      const MOUNT_DELAY_MS = 150;
      let filters = {};
      let controller;

      const route = () => new URL(location.hash.slice(1) || "/", location.origin);
      const view = () => (route().pathname === "/results" ? "RESULTS" : "SEARCH");

      function visibleFlights() {
        const query = route().searchParams;
        return FLIGHTS.filter(
          (flight) =>
            (!filters.stops || filters.stops.includes(flight.stops)) &&
            (filters.maxPrice === undefined || flight.price <= filters.maxPrice) &&
            (filters.minPrice === undefined || flight.price >= filters.minPrice),
        ).map((flight) => ({
          ...flight,
          origin: query.get("origin"),
          destination: query.get("destination"),
          departureTime: "09:00",
          arrivalTime: "17:00",
          duration: "8h",
        }));
      }

      function render() {
        document.getElementById("view").textContent = view();
        document.getElementById("search").textContent = route().searchParams.toString();
        document.getElementById("filters").textContent = JSON.stringify(filters);
        document.getElementById("shown").textContent = visibleFlights().map((flight) => flight.id).join(",");
      }

      const iata = { type: "string", pattern: "^[A-Z]{3}$", minLength: 3, maxLength: 3 };
      const searchFlights = {
        name: "searchFlights",
        description: "Searches for flights with the given parameters.",
        inputSchema: {
          type: "object",
          properties: {
            origin: { ...iata, description: "City or airport IATA code for the origin." },
            destination: { ...iata, description: "City or airport IATA code for the destination airport." },
            tripType: { type: "string", enum: ["one-way", "round-trip"], description: 'The trip type. Can be "one-way" or "round-trip".' },
            outboundDate: { type: "string", description: "The outbound date in YYYY-MM-DD format.", format: "date" },
            inboundDate: { type: "string", description: "The inbound date in YYYY-MM-DD format.", format: "date" },
            passengers: { type: "number", description: "The number of passengers." },
          },
          required: ["origin", "destination", "tripType", "outboundDate", "inboundDate", "passengers"],
        },
        annotations: { readOnlyHint: false },
        execute: (params) => {
          if (!/^[A-Z]{3}$/.test(params.destination)) return "ERROR: `destination` must be a 3 letter city or airport IATA code.";
          if (!/^[A-Z]{3}$/.test(params.origin)) return "ERROR: `origin` must be a 3 letter city or airport IATA code.";
          filters = {};
          history.pushState(null, "", `#/results?${new URLSearchParams(params)}`);
          sync();
          return "A new flight search was started.";
        },
      };
      const listFlights = {
        name: "listFlights",
        description: "Returns the flights currently visible on the results page after all filters have been applied.",
        inputSchema: {},
        annotations: { readOnlyHint: true },
        execute: () => visibleFlights(),
      };
      const numbers = { type: "array", items: { type: "number" } };
      const setFilters = {
        name: "setFilters",
        description: "Sets the filters for flights.",
        inputSchema: {
          type: "object",
          properties: {
            stops: { ...numbers, description: "The list of stop counts to filter by." },
            airlines: { type: "array", items: { type: "string", pattern: "^[A-Z]{2}$" } },
            origins: { type: "array", items: iata },
            destinations: { type: "array", items: iata },
            minPrice: { type: "number", description: "The minimum price." },
            maxPrice: { type: "number", description: "The maximum price." },
            departureTime: numbers,
            arrivalTime: numbers,
            flightIds: numbers,
          },
        },
        annotations: { readOnlyHint: false },
        execute: (next) => {
          filters = { ...next };
          render();
          return "Filters successfully updated.";
        },
      };
      const resetFilters = {
        name: "resetFilters",
        description: "Resets all filters to their default values.",
        inputSchema: {},
        annotations: { readOnlyHint: false },
        execute: () => {
          filters = {};
          render();
          return "Filters successfully updated.";
        },
      };

      // Registers the current view's tools; leaving a view unregisters its tools.
      function sync() {
        controller?.abort();
        controller = new AbortController();
        const { signal } = controller;
        const register = (tool) => document.modelContext.registerTool(tool, { signal });
        render();
        register(searchFlights);
        if (view() === "RESULTS") {
          setTimeout(() => {
            if (signal.aborted) return;
            for (const tool of [listFlights, setFilters, resetFilters]) register(tool);
          }, MOUNT_DELAY_MS);
        }
      }

      if (document.modelContext) {
        addEventListener("popstate", sync);
        sync();
      } else document.getElementById("view").textContent = "NO_WEBMCP";
    </script>
  </body>
</html>
